<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form action="#" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"><b>Login</b></button>
        <a href="{% url 'signup' %}">Don't have an account?</a>
    </form>
</body>
</html>
